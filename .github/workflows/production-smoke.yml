name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  stem-director:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://musicdevnc.netlify.app

    steps:
      - name: Check operations page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            "$SITE/stem-agent/status" \
            -o /tmp/status.html
          test -s /tmp/status.html
          echo "Ops page reachable."

      - name: Wait for Phase 14 production readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 25 \
              "$SITE/api/stem-agent/readiness" -o /tmp/readiness.json; then
              DYNAMIC="$(jq -r '.capabilities.dynamicRouting // false' /tmp/readiness.json)"
              RECOVERY="$(jq -r '.capabilities.cloudRecovery // false' /tmp/readiness.json)"
              PERMANENT="$(jq -r '.capabilities.permanentOutputs // false' /tmp/readiness.json)"
              RESUMABLE="$(jq -r '.capabilities.resumableOutputUpload // false' /tmp/readiness.json)"
              FLEET_OK="$(jq -r '.services.workerFleet.ok // false' /tmp/readiness.json)"
              ARTIFACT_OK="$(jq -r '.services.artifactBroker.ok // false' /tmp/readiness.json)"
              if [[ "$DYNAMIC" == "true" && "$RECOVERY" == "true" && "$PERMANENT" == "true" && "$RESUMABLE" == "true" && "$FLEET_OK" == "true" && "$ARTIFACT_OK" == "true" ]]; then
                ready=true
                echo "Phase 14 permanent-output bundle detected on attempt $attempt."
                break
              fi
            fi
            echo "Netlify has not published the Phase 14 permanent-output bundle yet ($attempt/18)."
            sleep 5
          done
          if [[ "$ready" != "true" ]]; then
            echo "Production never exposed the Phase 14 readiness shape." >&2
            jq . /tmp/readiness.json 2>/dev/null || true
            exit 1
          fi

      - name: Check production readiness API
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          jq . /tmp/readiness.json

          STATUS="$(jq -r '.status' /tmp/readiness.json)"
          CONTROL="$(jq -r '.capabilities.controlPlaneReady' /tmp/readiness.json)"
          COMPUTE="$(jq -r '.capabilities.computeReady' /tmp/readiness.json)"
          DYNAMIC="$(jq -r '.capabilities.dynamicRouting // false' /tmp/readiness.json)"
          RECOVERY="$(jq -r '.capabilities.cloudRecovery // false' /tmp/readiness.json)"
          PERMANENT="$(jq -r '.capabilities.permanentOutputs // false' /tmp/readiness.json)"
          RESUMABLE="$(jq -r '.capabilities.resumableOutputUpload // false' /tmp/readiness.json)"
          EDGE_OK="$(jq -r '.services.edgeMirror.ok' /tmp/readiness.json)"
          FLEET_OK="$(jq -r '.services.workerFleet.ok // false' /tmp/readiness.json)"
          ARTIFACT_OK="$(jq -r '.services.artifactBroker.ok // false' /tmp/readiness.json)"
          READY_NODES="$(jq -r '.services.workerFleet.data.readyNodes // 0' /tmp/readiness.json)"
          DEEP_NODES="$(jq -r '.services.workerFleet.data.deepReadyNodes // 0' /tmp/readiness.json)"
          NEXT_ACTION="$(jq -r '.nextAction' /tmp/readiness.json)"

          if [[ "$CONTROL" != "true" ]]; then
            echo "Stem Director control plane is not ready." >&2
            exit 1
          fi
          if [[ "$EDGE_OK" != "true" ]]; then
            echo "Supabase lifecycle Edge gateway is not healthy." >&2
            exit 1
          fi
          if [[ "$FLEET_OK" != "true" || "$DYNAMIC" != "true" ]]; then
            echo "Worker Mesh discovery gateway is not healthy." >&2
            exit 1
          fi
          if [[ "$ARTIFACT_OK" != "true" || "$RECOVERY" != "true" ]]; then
            echo "Durable source recovery is not healthy." >&2
            exit 1
          fi
          if [[ "$PERMANENT" != "true" || "$RESUMABLE" != "true" ]]; then
            echo "Permanent resumable stem output persistence is not healthy." >&2
            exit 1
          fi
          if [[ "$COMPUTE" == "true" && "$STATUS" != "ready" ]]; then
            echo "Compute is available but production readiness is not ready: $STATUS" >&2
            exit 1
          fi
          if [[ "$COMPUTE" != "true" && "$STATUS" != "control-plane-ready" ]]; then
            echo "Expected control-plane-ready while compute is in standby, got: $STATUS" >&2
            exit 1
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "compute=$COMPUTE" >> "$GITHUB_OUTPUT"

          {
            echo "## Stem Director production smoke"
            echo ""
            echo "- Readiness: \`$STATUS\`"
            echo "- Control plane: \`$CONTROL\`"
            echo "- Lifecycle Edge gateway: \`$EDGE_OK\`"
            echo "- Worker Mesh gateway: \`$FLEET_OK\`"
            echo "- Durable source broker: \`$ARTIFACT_OK\`"
            echo "- Dynamic routing: \`$DYNAMIC\`"
            echo "- Cross-node recovery: \`$RECOVERY\`"
            echo "- Permanent private outputs: \`$PERMANENT\`"
            echo "- Resumable output upload: \`$RESUMABLE\`"
            echo "- Ready nodes: \`$READY_NODES\`"
            echo "- Deep-ready nodes: \`$DEEP_NODES\`"
            echo "- Compute healthy: \`$COMPUTE\`"
            echo "- Next action: $NEXT_ACTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deep-compute readiness note
        if: ${{ steps.readiness.outputs.compute == 'true' }}
        shell: bash
        run: |
          DEEP="$(jq -r '.capabilities.deepReady' /tmp/readiness.json)"
          CUDA="$(jq -r '.capabilities.cuda' /tmp/readiness.json)"
          SAM="$(jq -r '.capabilities.samAudio' /tmp/readiness.json)"
          HIERARCHICAL="$(jq -r '.capabilities.hierarchicalRouting' /tmp/readiness.json)"
          RESTART="$(jq -r '.capabilities.restartRecovery' /tmp/readiness.json)"
          CROSS_NODE="$(jq -r '.capabilities.cloudRecovery' /tmp/readiness.json)"
          PERMANENT="$(jq -r '.capabilities.permanentOutputs' /tmp/readiness.json)"
          MIRROR="$(jq -r '.capabilities.cloudMirror' /tmp/readiness.json)"
          {
            echo ""
            echo "### Compute capabilities"
            echo "- CUDA: \`$CUDA\`"
            echo "- SAM-Audio: \`$SAM\`"
            echo "- Agentic Deep ready: \`$DEEP\`"
            echo "- Hierarchical routing: \`$HIERARCHICAL\`"
            echo "- Same-node restart recovery: \`$RESTART\`"
            echo "- Cross-node source replay: \`$CROSS_NODE\`"
            echo "- Permanent private outputs: \`$PERMANENT\`"
            echo "- Cloud lifecycle mirror: \`$MIRROR\`"
          } >> "$GITHUB_STEP_SUMMARY"
