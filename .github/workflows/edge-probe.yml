name: Stem Edge Probe

on:
  push:
    branches: [agentic-stem-edge-hotfix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe live Supabase Edge routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://jgnsrjjgeodqruafafav.supabase.co/functions/v1"
          for fn in stem-worker-mirror stem-worker-heartbeat; do
            echo "--- $fn ---"
            code="$(curl --silent --show-error --location --max-time 15 -o "/tmp/$fn.json" -w '%{http_code}' "$BASE/$fn")"
            echo "HTTP $code"
            jq . "/tmp/$fn.json" || cat "/tmp/$fn.json"
          done
