name: Cleanup engine QA
on:
  pull_request:
    paths:
      - 'services/separator/cleanup_engine/**'
      - 'services/separator/agent_cleanup.py'
      - 'services/separator/agent_api.py'
      - 'services/separator/agent_phase14.py'
      - 'app/stem-agent/**'
      - '.github/workflows/cleanup-engine-qa.yml'
  push:
    branches:
      - feature/instrument-cleanup-engine
    paths:
      - 'services/separator/cleanup_engine/**'
      - 'services/separator/agent_cleanup.py'
      - 'services/separator/agent_api.py'
      - 'services/separator/agent_phase14.py'
      - 'app/stem-agent/**'
      - '.github/workflows/cleanup-engine-qa.yml'
permissions:
  contents: read
jobs:
  cleanup-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy scipy soundfile fastapi==0.115.6 python-multipart==0.0.20 httpx==0.28.1
      - run: python -m py_compile services/separator/agent_cleanup.py services/separator/agent_phase14.py services/separator/cleanup_engine/*.py
      - run: cd services/separator && python -m pytest -q cleanup_engine/test_validation.py cleanup_engine/test_quality.py cleanup_engine/test_pipeline.py test_cleanup_api.py
