name: Phase 12 Edge Probe

on:
  push:
    branches: [agentic-stem-phase12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe artifact broker health and unsigned rejection
        shell: bash
        run: |
          set -euo pipefail
          URL="https://jgnsrjjgeodqruafafav.supabase.co/functions/v1/stem-worker-artifacts"

          health_code="$(curl --silent --show-error --location --max-time 15 -o /tmp/health.json -w '%{http_code}' "$URL")"
          echo "health HTTP $health_code"
          jq . /tmp/health.json
          test "$health_code" = "200"
          test "$(jq -r '.status' /tmp/health.json)" = "ok"
          test "$(jq -r '.configReady' /tmp/health.json)" = "true"
          test "$(jq -r '.leaseSeconds' /tmp/health.json)" = "60"

          unsigned_code="$(curl --silent --show-error --location --max-time 15 -o /tmp/unsigned.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$URL")"
          echo "unsigned HTTP $unsigned_code"
          jq . /tmp/unsigned.json
          if [[ "$unsigned_code" != "400" && "$unsigned_code" != "401" ]]; then
            echo "Unsigned artifact claim was not rejected at the authentication/envelope boundary." >&2
            exit 1
          fi
