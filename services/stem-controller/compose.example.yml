services:
  stem-compute-controller:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_STEM_POD_ID: ${RUNPOD_STEM_POD_ID}
      STEM_CONTROLLER_AUTO_START: ${STEM_CONTROLLER_AUTO_START:-false}
      STEM_CONTROLLER_ACCEPT_GPU_CHARGES: ${STEM_CONTROLLER_ACCEPT_GPU_CHARGES:-}
      STEM_CONTROLLER_AUTO_STOP: ${STEM_CONTROLLER_AUTO_STOP:-false}
      STEM_CONTROLLER_IDLE_SECONDS: ${STEM_CONTROLLER_IDLE_SECONDS:-600}
      STEM_CONTROLLER_POLL_SECONDS: ${STEM_CONTROLLER_POLL_SECONDS:-5}
      STEM_CONTROLLER_PORT: "8080"
