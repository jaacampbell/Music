    creative_prompt: "Take an Aphex Twin-influenced IDM sequence: complex, precisely programmed. Record elements to tape if possible (or use tape saturation simulation carefully). Add subtle room ambiance around electronic elements — not as reverb but as acoustic placement. Apply Godrich's instinct toward acoustic-electronic hybridity: let the electronic elements exist in physical space rather than digital space."

