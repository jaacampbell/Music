    creative_prompt: "Program a standard Rashad-style footwork pattern: 160 BPM, kick pattern independent of snare, vocal sample stutter. Replace all drum sounds with Aphex-style timbres: FM synthesis, unusual attacks and decays, digitally distorted transients. Keep the footwork rhythmic structure exactly; swap the sonic palette to IDM territory. What does a footwork track sound like through IDM ears?"

