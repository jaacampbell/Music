    creative_prompt: "Build a Kraftwerk-style 4-bar loop: sequenced bassline, drum machine, one synth melody. Then apply Horn's production philosophy: spend a full session getting every element sounding absolutely perfect. EQ each element individually, process with Horn-level care, layer subtle details that reward listening. The minimalist structure gets maximalist treatment. Then repeat for 5 minutes."

  # ── Nigel Godrich (PDNA-000043) ───────────────────────────────────────────
