    creative_prompt: "Find a Pete Rock-style soul sample: warm, jazz-inflected, melodically rich. Instead of building a boom-bap beat around it, apply Burial's processing: slow it down, add large room reverb, let the sample stretch until harmonic content becomes atmospheric. Place ghost percussion underneath — not snap-snare but loose, pitched, and distant. The soul sample becomes the environment."

