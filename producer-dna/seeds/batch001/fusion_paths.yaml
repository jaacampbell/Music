    creative_prompt: "Build a Metro-style beat with all its characteristic elements intact: 808 pattern, hi-hat rhythm, dark sample, trademark tag. Now systematically destabilize each element Arca-style: pitch the 808 unexpectedly mid-pattern, add irregular rhythmic stutter to the hi-hat, remove the sample at unexpected moments. Maintain the tension of Metro's atmosphere while introducing Arca's instability."

  # ── Zaytoven (PDNA-000021) ────────────────────────────────────────────────
  - primary_pdna: PDNA-000021
    secondary_pdna: PDNA-000035
