    creative_prompt: "Record Rodgers-style rhythm guitar: tight chord voicing, staccato attack, groove-forward playing. Don't add a drum track. Instead, program Timbaland-style percussion that treats the guitar as ONE of several rhythmic voices rather than the rhythm section anchor. The guitar becomes foreground; the drums work around it rather than under it."

  # ── Trevor Horn (PDNA-000041) ─────────────────────────────────────────────
