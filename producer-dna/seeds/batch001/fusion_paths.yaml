    creative_prompt: "Choose a Rahman-style raga-influenced scale or mode. Build an Eno-style ambient piece: no melody, no rhythm, only slowly evolving tonal drones in that scale. Use the cultural specificity of the Indian harmonic system (drone, microtonal emphasis, specific ornamentation pitch points) but apply Eno's absolute restraint — no forward momentum, only color change."

