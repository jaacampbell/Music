    creative_prompt: "Build a Kabza-style Amapiano foundation: log drums, piano chord stabs, sub bass. Slow from 112 BPM to 95 BPM (Burial range). Process the piano chords with heavy reverb and slight pitch instability. Let the log drums maintain their forward propulsion while the piano becomes ghostly and atmospheric. The Amapiano groove survives the spectral treatment."

