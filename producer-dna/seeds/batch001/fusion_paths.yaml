    creative_prompt: "Pull two samples — one in Pete Rock's style (soul, jazz, warm, NY-adjacent) and one in Madlib's style (obscure, global, more dissonant or unusual). Build a beat that uses both simultaneously: Pete Rock's sample provides the emotional warmth, Madlib's provides the unexpected harmonic content. Don't let either dominate; find the overlap."

  # ── DJ Screw (PDNA-000027) ────────────────────────────────────────────────
  - primary_pdna: PDNA-000027
    secondary_pdna: PDNA-000033
    secondary_element: "Kraftwerk — mechanical precision and tempo discipline"
    fusion_description: "DJ Screw's technique of slowing records down to reveal their emotional gravity and Kraftwerk's belief in metronomic tempo as compositional statement represent opposite approaches to the same question: what does tempo do to feeling? Screw slows to create heaviness; Kraftwerk locks to create hypnosis. The merger: what does Screw's pitch-and-time processing do to Kraftwerk's precisely quantized source material?"
    creative_prompt: "Take a Kraftwerk track and apply Screw's technique: slow it to 60-70% of original speed using pitch-preservation processing. The mechanistic sequencer pattern remains intact but the tempo shifts dramatically. Then do the inverse: take a screwed source and pitch-lock it back to Kraftwerk tempo. What survives each operation? What is gained and lost?"

  - primary_pdna: PDNA-000027
    secondary_pdna: PDNA-000004
    secondary_element: "Brian Eno — ambient generativity and time dilation"
    fusion_description: "Screw's slowed-and-chopped philosophy and Eno's ambient music share a fundamental interest in altering the listener's relationship to time. Screw does it through deliberate tempo reduction; Eno does it through texture that removes pulse and forward momentum. Both create music that expands subjective time. The merger: apply Screw's tempo manipulation to Eno's ambient source material."
    creative_prompt: "Take an Eno ambient track (or build an Eno-style texture). Apply Screw's technique to it: slow to 70% speed. The already-ambient texture should become even more expanded and weightless. Note the difference between Eno's designed temporal expansion and Screw's mechanical one. Now chop between different slowed Eno sections as Screw would chop between tracks."

  # ── Max Martin (PDNA-000038) ─────────────────────────────────────────────
  - primary_pdna: PDNA-000038
    secondary_pdna: PDNA-000004
    secondary_element: "Brian Eno — ambient process and art music minimalism"
    fusion_description: "Max Martin's total mastery of pop song craft — the melodic hook, the dynamic build, the chorus release — applied through Eno's compositional philosophy of restraint and process. Both are meticulous craftsmen in different registers. The merger: use Eno's Oblique Strategies to constrain a Max Martin-style songwriting session, and apply Eno's production minimalism to pop's maximalist structural demands."
    creative_prompt: "Write a pop chorus using strict Martin criteria: melodic hook in the first 5 notes, emotional release, anthemic quality. Now apply Eno's production philosophy: strip the arrangement to the minimum that makes the hook work. No doubling of elements, no layering for thickness, one sonic texture per function. The hook should be exposed, not wrapped. Does the song survive the reduction?"

  # ── Sylvia Robinson (PDNA-000010) ────────────────────────────────────────
  - primary_pdna: PDNA-000010
    secondary_pdna: PDNA-000033
    secondary_element: "Kraftwerk — mechanical sequencer and electronic rhythm"
    fusion_description: "Robinson's role in creating hip-hop's recorded form — sampling a rhythm section, placing spoken word over it — and Kraftwerk's parallel invention of sequencer-based electronic music with spoken/processed vocals share a 1979 moment when both were fundamentally changing what pop music could be with new technology. The merger makes the historical parallel explicit."
    creative_prompt: "Build a track that uses Robinson's hip-hop structural logic (rhythm section loop, vocal over the top) but replaces the funk band source material with Kraftwerk's sequencer aesthetic. Program a Kraftwerk-style synth bassline and mechanistic drum machine. Place rap or spoken word over it. You are making hip-hop whose rhythm section is an electronic machine rather than a sampled funk band — examine what changes."
