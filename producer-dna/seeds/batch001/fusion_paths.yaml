    creative_prompt: "Build a Metro-style trap beat: dark 808 sub, sharp hi-hat pattern, minimal melodic sample. Slow the tempo to 130 BPM (between trap and 2-step). Apply Burial's timbral processing: pitch-shift the hi-hats, add vinyl degradation to the 808, let the sample breathe with large reverb. Keep Metro's rhythmic approach; adopt Burial's sonic world. The Atlanta night becomes the London night."

