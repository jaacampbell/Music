    creative_prompt: "Write an 8-bar piano melody in the Zaytoven style: semi-classical movement, emotional directness, trap-adjacent scale choices. Now apply Sakamoto's editing philosophy: remove every note that isn't essential. The result should be the same emotional territory with perhaps 40% of the original notes. Add sparse trap drums under the edited melody at 140 BPM."

  # ── DJ Rashad (PDNA-000050) ───────────────────────────────────────────────
