    creative_prompt: "Set up a recording session with no predetermined compositional material. Use 3 Oblique Strategy cards as the only guide: one for instrumentation, one for process, one for structure. Record with Godrich-level attention to sonic detail: room placement, microphone choice, tape gain. Let the cards determine the content; let the craft determine the sound."

  # ── Steve Albini (PDNA-000044) ────────────────────────────────────────────
  - primary_pdna: PDNA-000044
    secondary_pdna: PDNA-000006
    secondary_element: "King Tubby — mixing board as compositional instrument"
    fusion_description: "Albini's philosophy of absolute transparency — the record should sound like the band sounds in the room — and Tubby's philosophy of the mixing board as creative instrument are apparently opposite but share a belief in the performance captured at the desk. Both are anti-overdub purists in different ways. The merger asks: what if Albini applied Tubby's live-desk improvisation philosophy to his transparent recordings?"
    creative_prompt: "Record a band live with Albini-style microphone placement and zero processing during tracking — absolute transparency. Then perform a Tubby-style live dub mix: faders up and down, effects sends varied in real time, without post-production editing. Record the desk performance as a unique artifact. Compare 5 different live mixes of the same recording — each is a unique Tubby-style composition."

  # ── Rick Rubin (PDNA-000011) ──────────────────────────────────────────────
  - primary_pdna: PDNA-000011
    secondary_pdna: PDNA-000004
    secondary_element: "Brian Eno — ambient minimalism and negative space"
    fusion_description: "Rubin's philosophy of stripping production to essence and Eno's philosophy of building music from minimal elements toward maximum tonal environment share a common departure point: both distrust excess. Rubin removes what doesn't serve the song; Eno never adds what doesn't serve the texture. The merger: a Rubin-produced track where the space between elements is designed with Eno's attention to tonal environment."
    creative_prompt: "Start with a full-band arrangement (guitar, bass, drums, vocals). Apply Rubin's reductive method: remove elements until removing the next one would break the song. Stop there. Now, instead of leaving that space as silence, fill it with Eno-style ambient texture — tonal drone, slowly shifting pad — that occupies the negative space without competing with the remaining arrangement."

  # ── Flood (PDNA-000042) ───────────────────────────────────────────────────
