    creative_prompt: "Program a Rashad-style footwork rhythm structure (160 BPM, polyrhythmic, track-starting percussion). Process every element through Burial's audio world: degradation, large reverb, pitch-shifting, sample fragmentation. Let the complex footwork pattern emerge from ghost audio rather than sharp transients. The rhythm is Rashad; the atmosphere is Burial."

