      desire — his Moog basslines and drum machine pulses gave Donna Summer's vocal something to
      resist and surrender to simultaneously. By locking the tempo absolutely and layering synthetic
      timbres against it, he built the structural grammar that runs through house, techno, and all
      subsequent electronic dance music.

