    dna_summary: >-
      Phil Spector invented the Wall of Sound by layering redundant instrumental parts — multiple
      pianos, guitars, basses, and strings — through a single mono reverb chamber, creating a
      compression of frequency and space that was simultaneously massive and intimate. The approach
      was not a technique but a worldview: density as emotion, mono as truth.

