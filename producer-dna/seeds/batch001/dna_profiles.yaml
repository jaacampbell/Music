    dna_summary: >-
      Daft Punk (Thomas Bangalter and Guy-Manuel de Homem-Christo) built a career from two
      productive myths: the robot and the archive. The robot gave them permission to be mechanical,
      compressed, and repetitive. The archive gave them permission to quote disco, funk, rock, and
      German electronic music with reverence rather than irony. Random Access Memories represents
      the synthesis: live musicians, analog warmth, and the memory of an idealized past encoded in
      digital precision.

