    dna_summary: >-
      Nile Rodgers builds groove from the space between guitar notes — his right-hand rhythm playing
      is a study in strategic silence, using muted hits and precise chord voicings to create momentum
      through restraint. As co-founder of Chic and as a producer (Madonna's Like a Virgin, David Bowie's
      Let's Dance, Daft Punk's Get Lucky) he demonstrates that the same rhythmic philosophy functions
      across disco, pop, and electronic music because it is fundamentally about the body's relationship
      with time.

