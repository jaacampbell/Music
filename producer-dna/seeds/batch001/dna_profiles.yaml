    dna_summary: >-
      Burial's Untrue (2007) established a mood-production methodology: shuffle-patterned 2-step drums
      beneath vinyl crackle and field recordings, with vocal samples chopped into fragments that
      communicate emotion without language. His anonymity was integral — the music comes from nowhere,
      from urban infrastructure and 3am buses and rain on windows, and does not need a face. The
      influence on UK electronic music (grime, UK garage, ambient techno) is pervasive and still expanding.

