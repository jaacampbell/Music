    dna_summary: >-
      Kraftwerk replaced expression with function, building music from sequencer-driven repetition,
      synthesized vocal timbres, and a graphic design language of machinery and transit systems.
      Their decision to treat the computer as collaborator rather than tool — programming rather than
      playing — established the structural logic of techno, hip-hop, and electronic pop simultaneously.
      Trans-Europe Express alone contains the DNA of a thousand subsequent records.

