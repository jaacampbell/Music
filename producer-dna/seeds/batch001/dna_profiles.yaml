    dna_summary: >-
      Madlib approaches production as a listener first: his crate contains jazz, Brazilian, African,
      library music, and obscure funk, and he loops sections for their textural and emotional quality
      rather than their recognizability. The resulting beats are lo-fi in the sense that imperfection
      is accepted and often amplified — tape hiss, vinyl noise, and off-beat timing treated as
      character — creating an underground idiom so influential that it effectively split hip-hop
      production into commercial and Madlib-school lineages.

