    dna_summary: >-
      Wendy Carlos's Switched-On Bach (1968) demonstrated that the Moog synthesizer could achieve
      timbral specificity and expressive nuance comparable to acoustic instruments, and that
      electronic music could interpret the Western classical canon rather than rejecting it. Her
      subsequent work in electronic orchestration and film scoring (A Clockwork Orange, The Shining)
      established disciplined approaches to synthesizer articulation that influenced every subsequent
      composer working at the electronic-acoustic boundary.

