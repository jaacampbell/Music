    dna_summary: >-
      DJ Screw invented Chopped and Screwed by running cassette tapes at reduced speed and inserting
      vinyl scratches (chops) at regular intervals, creating a meditative, syrup-soaked parallel
      universe where tempo itself becomes the primary sonic dimension. The aesthetic — slowed vocal
      pitch, stretched percussion, dreamy repetition — maps directly onto the altered consciousness
      of Houston's lean culture and became a globally recognized genre despite originating entirely
      within a regional mixtape tradition.

