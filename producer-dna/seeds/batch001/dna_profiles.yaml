    dna_summary: >-
      A. R. Rahman synthesizes Carnatic classical theory, Sufi devotional practice, Western orchestral
      arrangement, and electronic production into a uniquely Indian cinematic language that communicates
      across linguistic and cultural boundaries. His Slumdog Millionaire score introduced this approach
      globally, but the depth of his fusion — modal melody over quantized rhythm, acoustic ensemble
      over synthesized texture — was already fully developed in Tamil and Hindi film music across
      the preceding decade.

