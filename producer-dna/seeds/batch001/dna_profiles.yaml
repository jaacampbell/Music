    dna_summary: >-
      DJ Rashad accelerated footwork — the Chicago ghetto house tradition of battle-dance music —
      to 160 BPM and saturated it with dense sample chopping, emotional vocal fragments, and
      polyrhythmic drum programming that creates a sensation of perpetual forward momentum without
      resolution. Double Cup (2013) documented a complete genre's technical and emotional vocabulary
      and introduced footwork as international avant-garde electronic music while remaining rooted
      in Chicago's social infrastructure.
