    dna_summary: >-
      DJ Premier established the boom bap grammar: a loop of vinyl-sourced drums running beneath
      chopped melodic samples, interrupted by Premier's own turntable scratches in place of a
      conventional hook. The formula is rigorous and intentionally limiting — its power comes from
      depth within constraints, every Premier production identifiable within seconds by the
      combination of a specific crunch, a specific pocket, and the Primo stab.

