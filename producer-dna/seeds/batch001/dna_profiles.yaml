    dna_summary: >-
      Steve Albini refused the title of producer, insisting on "recording engineer" — a distinction
      that encoded his philosophy: document what happens in the room at maximum fidelity, without
      compression, enhancement, or intervention. His technique of placing microphones for maximum
      room character rather than signal isolation gave records like Pixies' Surfer Rosa and PJ
      Harvey's Rid of Me a physical rawness that became the defining sound of independent rock
      and proved that anti-production is itself a production aesthetic.

