    dna_summary: >-
      Aphex Twin operates at the edge of what is physically possible to program and process,
      combining mathematical polyrhythm (his Druqks compositions use time signatures that no human
      could perform) with melodic writing of genuine emotional depth. Selected Ambient Works Volume II
      defined a mode of sound design — evolving timbres, minimal pitch, maximal texture — while
      tracks like "Come to Daddy" proved that the same sensibility could produce horror. The range
      is the point.

