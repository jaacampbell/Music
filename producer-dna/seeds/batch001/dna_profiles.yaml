    dna_summary: >-
      Dr. Dre fused P-Funk's harmonic architecture with a West Coast menace defined by sub-bass
      physicality and meticulous arrangement precision. His low-end approach — kick and bass tuned to
      specific semitones, occupying distinct frequency bands — became the reference standard against
      which hip-hop and subsequently trap mixed their bottom end. The Chronic defined a regional
      aesthetics and launched careers that reshaped American music.

