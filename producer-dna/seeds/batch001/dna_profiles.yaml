    dna_summary: >-
      George Martin fused classical conservatoire training with commercial studio intuition,
      building orchestral counterpoint directly into pop songs at a time when strings were
      decoration. His work with The Beatles showed that a producer could function as a
      compositional co-author, shaping harmonic language and texture rather than just balancing
      faders — a model nearly every subsequent pop producer has inherited.

