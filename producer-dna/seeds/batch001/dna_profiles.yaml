    dna_summary: >-
      Timbaland rewired rhythm-and-blues production around non-Western percussion — tabla patterns,
      Indian vocal ornaments, synthetic African polyrhythm — combined with deliberate negative space
      where a Western producer would have filled the downbeat. His late-1990s and 2000s productions
      for Aaliyah, Missy Elliott, and Justin Timberlake introduced a percussive architecture that was
      simultaneously danceable and alien, and no subsequent pop rhythm has been fully free of his influence.

