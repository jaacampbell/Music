    dna_summary: >-
      Lee "Scratch" Perry conceived the recording studio as an alchemical instrument, treating echo
      units, tape delays, and the mixing board as extensions of ritual and vision. His Black Ark
      productions built an aesthetic of purposeful disintegration — tracks where reverb bleeds into
      reverb and instruments appear to phase through walls — that prefigured both industrial music
      and ambient by treating imperfection as the signal, not the noise.

